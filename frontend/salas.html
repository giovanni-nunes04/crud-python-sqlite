<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Syne:wght@400;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg:     #0b0c0f;
        --bg2:    #111318;
        --border: #23262f;
        --blue:   #4f8ef7;
        --text:   #d4d8e2;
        --dim:    #555b6e;
        --accent: #f0a500;
        --green:  #3ecf8e;
        --red:    #ff4444;
      }

      * { box-sizing: border-box; }

      body {
        background: var(--bg2);
        color: var(--text);
        font-family: "Syne", sans-serif;
        margin: 0;
        padding: 20px;
        scrollbar-width: thin;
        scrollbar-color: var(--border) transparent;
      }

      /* ── Formulário ─────────────────────────────────────────── */
      .form-card {
        background: var(--bg);
        border: 1px solid var(--border);
        padding: 24px;
        border-radius: 8px;
        margin-bottom: 24px;
      }

      .section-label {
        font-size: 12px;
        color: var(--blue);
        margin-bottom: 18px;
        letter-spacing: 0.05em;
      }

      .form-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        gap: 16px;
      }

      .form-group label {
        display: block;
        font-size: 11px;
        text-transform: uppercase;
        color: var(--dim);
        margin-bottom: 8px;
        letter-spacing: 0.06em;
      }

      input,
      select {
        width: 100%;
        background: var(--bg2);
        border: 1px solid var(--border);
        color: white;
        padding: 10px 12px;
        border-radius: 4px;
        font-family: "IBM Plex Mono", monospace;
        font-size: 13px;
        transition: border-color 0.2s;
        appearance: none;
        -webkit-appearance: none;
      }

      /* Seta customizada no select */
      .select-wrap { position: relative; }
      .select-wrap::after {
        content: "▾";
        position: absolute;
        right: 12px;
        top: 50%;
        transform: translateY(-50%);
        color: var(--dim);
        pointer-events: none;
        font-size: 12px;
      }

      input:focus,
      select:focus {
        outline: none;
        border-color: var(--blue);
      }

      select option { background: var(--bg); }

      /* Select desabilitado (carregando/readonly) */
      select:disabled, input:disabled { opacity: 0.5; cursor: not-allowed; }

      /* ── Período ─────────────────────────────────────────────── */
      .period-row {
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        gap: 8px;
        align-items: center;
      }

      .period-sep {
        color: var(--dim);
        font-size: 18px;
        text-align: center;
        padding-top: 2px;
      }

      /* ── Botão ───────────────────────────────────────────────── */
      .btn-blue {
        background: var(--blue);
        color: white;
        border: none;
        padding: 12px 28px;
        border-radius: 4px;
        cursor: pointer;
        font-weight: 700;
        text-transform: uppercase;
        font-size: 11px;
        margin-top: 20px;
        letter-spacing: 0.07em;
        transition: opacity 0.2s, transform 0.1s;
      }

      .btn-blue:hover   { opacity: 0.85; }
      .btn-blue:active  { transform: scale(0.98); }
      .btn-blue:disabled { opacity: 0.4; cursor: not-allowed; }

      /* ── Tabela ──────────────────────────────────────────────── */
      .table-wrap {
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 8px;
        overflow: hidden;
      }

      .table-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 16px 20px;
        border-bottom: 1px solid var(--border);
      }

      .table-title { font-size: 11px; color: var(--blue); text-transform: uppercase; letter-spacing: 0.1em; }
      .table-count { font-size: 11px; color: var(--dim);  font-family: "IBM Plex Mono", monospace; }

      /* Timer de auto-refresh */
      .refresh-bar {
        height: 2px;
        background: var(--border);
        position: relative;
        overflow: hidden;
      }

      .refresh-bar-fill {
        height: 100%;
        background: var(--blue);
        width: 100%;
        transform-origin: left;
        animation: shrink 60s linear infinite;
      }

      @keyframes shrink {
        from { transform: scaleX(1); }
        to   { transform: scaleX(0); }
      }

      table { width: 100%; border-collapse: collapse; }

      th {
        background: rgba(255,255,255,0.02);
        text-align: left;
        padding: 13px 16px;
        font-size: 10px;
        text-transform: uppercase;
        color: var(--dim);
        border-bottom: 1px solid var(--border);
        letter-spacing: 0.08em;
      }

      td {
        padding: 13px 16px;
        border-bottom: 1px solid var(--border);
        font-size: 13px;
        font-family: "IBM Plex Mono", monospace;
      }

      tr:last-child td  { border-bottom: none; }
      tr:hover td       { background: rgba(255,255,255,0.012); }

      /* ── Badges ─────────────────────────────────────────────── */
      .status-badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 4px 10px;
        border-radius: 4px;
        font-size: 10px;
        text-transform: uppercase;
        font-weight: 800;
        letter-spacing: 0.05em;
      }

      .status-badge::before {
        content: "";
        width: 6px; height: 6px;
        border-radius: 50%;
        flex-shrink: 0;
      }

      .reservada {
        background: rgba(79,142,247,0.1);
        color: var(--blue);
      }
      .reservada::before { background: var(--blue); }

      .em-uso {
        background: rgba(240,165,0,0.15);
        color: var(--accent);
        animation: pulse-badge 2s ease-in-out infinite;
      }
      .em-uso::before {
        background: var(--accent);
        animation: pulse-dot 2s ease-in-out infinite;
      }

      @keyframes pulse-badge {
        0%, 100% { box-shadow: none; }
        50%       { box-shadow: 0 0 8px rgba(240,165,0,0.3); }
      }
      @keyframes pulse-dot {
        0%, 100% { transform: scale(1); }
        50%       { transform: scale(1.4); }
      }

      /* ── Período na tabela ───────────────────────────────────── */
      .period-cell { display: flex; flex-direction: column; gap: 3px; }
      .period-date { color: var(--text); }
      .period-time { color: var(--dim);  font-size: 11px; }

      /* ── Sala na tabela ──────────────────────────────────────── */
      .sala-cell {
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .sala-name  { color: white; font-weight: 600; }
      .sala-resp  { color: var(--dim); font-size: 11px; }

      /* ── Botão excluir ───────────────────────────────────────── */
      .btn-delete {
        color: var(--red);
        background: none;
        border: none;
        cursor: pointer;
        font-size: 15px;
        padding: 5px 9px;
        border-radius: 4px;
        transition: background 0.2s;
        line-height: 1;
      }
      .btn-delete:hover { background: rgba(255,68,68,0.1); }

      /* ── Estado vazio ────────────────────────────────────────── */
      .empty-state {
        text-align: center;
        padding: 52px 24px;
        color: var(--dim);
      }
      .empty-state .icon { font-size: 36px; display: block; margin-bottom: 12px; }
      .empty-state p     { margin: 0; font-size: 13px; font-family: "IBM Plex Mono", monospace; }

      /* ── Toast ───────────────────────────────────────────────── */
      .toast {
        position: fixed;
        bottom: 24px;
        right: 24px;
        background: var(--bg);
        border: 1px solid var(--border);
        color: var(--text);
        padding: 12px 20px;
        border-radius: 6px;
        font-size: 13px;
        font-family: "IBM Plex Mono", monospace;
        max-width: 360px;
        transform: translateY(80px);
        opacity: 0;
        transition: all 0.3s ease;
        z-index: 1000;
        line-height: 1.4;
      }
      .toast.show    { transform: translateY(0); opacity: 1; }
      .toast.success { border-color: var(--green); color: var(--green); }
      .toast.error   { border-color: var(--red);   color: var(--red);   }
      .toast.warn    { border-color: var(--accent); color: var(--accent); }
    </style>
  </head>
  <body>

    <div class="form-card">
      <div class="section-label">// nova reserva de ambiente</div>

      <form id="formSalas" onsubmit="salvarSala(event)">
        <div class="form-grid">

          <div class="form-group">
            <label>Ambiente</label>
            <div class="select-wrap">
              <select id="sala" required>
                <option value="" disabled selected>Selecione a sala…</option>
                </select>
            </div>
          </div>

          <div class="form-group" id="divAdminSelecionaFunc" style="display: none;">
            <label>Responsável</label>
            <div class="select-wrap">
              <select id="funcionario">
                <option value="" disabled selected>Carregando…</option>
              </select>
            </div>
          </div>

          <div class="form-group" id="divFuncLogado" style="display: none;">
             <label>Responsável</label>
             <input id="inputFuncionarioAuto" disabled style="opacity: 0.6" value="Seu nome (Automático)" />
          </div>

          <div class="form-group">
            <label>Data de Uso</label>
            <input type="date" id="data_uso" required />
          </div>

          <div class="form-group" style="grid-column: span 2;">
            <label>Período de Reserva</label>
            <div class="period-row">
              <input type="time" id="inicio_hr"  required />
              <div class="period-sep">→</div>
              <input type="time" id="termino_hr" required />
            </div>
          </div>

        </div>

        <button type="submit" class="btn-blue" id="btnSubmit">
          ✓&nbsp; Confirmar Reserva
        </button>
      </form>
    </div>

    <div class="table-wrap">
      <div class="table-header">
        <span class="table-title">// reservas ativas</span>
        <span class="table-count" id="totalCount">—</span>
      </div>
      <div class="refresh-bar">
        <div class="refresh-bar-fill" id="refreshBar"></div>
      </div>

      <table>
        <thead>
          <tr>
            <th>#</th>
            <th>Ambiente / Responsável</th>
            <th>Período</th>
            <th>Status</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="listaSalas"></tbody>
      </table>
    </div>

    <div class="toast" id="toast"></div>

    <script>
      // 🔥 VERIFICAÇÃO DE LOGIN
      const tokenAcesso = localStorage.getItem('token');
      const isUserAdmin = localStorage.getItem('is_admin') === 'true';

      if (!tokenAcesso) {
          window.parent.location.href = '/login'; // Tira do iframe
      }

      const BASE = "http://localhost:5000/api";

      // ── Utilitários ────────────────────────────────────────────────────
      function toast(msg, tipo = "success") {
        const el = document.getElementById("toast");
        el.textContent = msg;
        el.className   = `toast ${tipo} show`;
        clearTimeout(el._t);
        el._t = setTimeout(() => (el.className = "toast"), 4000);
      }

      function fmtData(str) {
        if (!str) return "—";
        const [y, m, d] = str.split("-");
        return `${d}/${m}/${y}`;
      }

      // Função auxiliar para fazer fetch com o Token
      async function fetchComToken(url, options = {}) {
          const headers = {
              "Content-Type": "application/json",
              "Authorization": `Bearer ${tokenAcesso}`
          };
          
          const response = await fetch(url, { headers, ...options });
          
          if (response.status === 401) {
              localStorage.removeItem('token');
              localStorage.removeItem('is_admin');
              window.parent.location.href = '/login';
              throw new Error("Não autorizado");
          }
          return response;
      }

      // ── Carregar opções de salas (endpoint /api/salas/opcoes) ──────────
      async function carregarOpcoesSalas() {
        try {
          const res   = await fetchComToken(`${BASE}/salas/opcoes`);
          const salas = await res.json();
          const sel   = document.getElementById("sala");
          sel.innerHTML = `<option value="" disabled selected>Selecione a sala…</option>`;
          salas.forEach(s => {
            const opt  = document.createElement("option");
            opt.value  = s;
            opt.textContent = s;
            sel.appendChild(opt);
          });
        } catch (e) {
          console.error(e);
          toast("Erro ao carregar lista de salas", "error");
        }
      }

      // ── Configurar Form (Admin vs Funcionário) ─────────────────────────
      async function configurarFormularioFuncionario() {
        if (isUserAdmin) {
            document.getElementById("divAdminSelecionaFunc").style.display = "block";
            document.getElementById("divFuncLogado").style.display = "none";
            
            const sel = document.getElementById("funcionario");
            try {
              const res   = await fetchComToken(`${BASE}/funcionarios`);
              const lista = await res.json();

              sel.innerHTML = `<option value="" disabled selected>Selecione o responsável…</option>`;
              lista.forEach(f => {
                const opt      = document.createElement("option");
                opt.value      = f.nome;
                opt.textContent = f.nome;
                sel.appendChild(opt);
              });
              sel.disabled = false;
            } catch (e) {
              console.error(e);
              sel.innerHTML = `<option value="" disabled selected>Erro ao carregar</option>`;
              toast("Erro ao carregar funcionários", "error");
            }
        } else {
            document.getElementById("divAdminSelecionaFunc").style.display = "none";
            document.getElementById("divFuncLogado").style.display = "block";
        }
      }

      // ── Carregar e renderizar reservas ─────────────────────────────────
      async function carregarSalas() {
        try {
          const res   = await fetchComToken(`${BASE}/salas`);
          const salas = await res.json();
          const tbody = document.getElementById("listaSalas");
          const count = document.getElementById("totalCount");

          count.textContent = `${salas.length} registro${salas.length !== 1 ? "s" : ""}`;

          if (salas.length === 0) {
            tbody.innerHTML = `
              <tr>
                <td colspan="5">
                  <div class="empty-state">
                    <span class="icon">📋</span>
                    <p>Nenhuma reserva ativa no momento.</p>
                  </div>
                </td>
              </tr>`;
            return;
          }

          tbody.innerHTML = salas.map(s => {
            const statusCls = s.status.replace(/\s+/g, "-"); // "em uso" → "em-uso"
            return `
              <tr>
                <td style="color:var(--dim); width:40px">#${s.id}</td>
                <td>
                  <div class="sala-cell">
                    <span class="sala-name">${s.sala}</span>
                    <span class="sala-resp">${s.funcionario}</span>
                  </div>
                </td>
                <td>
                  <div class="period-cell">
                    <span class="period-date">${fmtData(s.data_uso)}</span>
                    <span class="period-time">${s.inicio_hr} → ${s.termino_hr}</span>
                  </div>
                </td>
                <td>
                  <span class="status-badge ${statusCls}">${s.status}</span>
                </td>
                <td style="width:48px; text-align:center">
                  <button class="btn-delete"
                    onclick="excluirSala(${s.id})"
                    title="Remover reserva">✕</button>
                </td>
              </tr>
            `;
          }).join("");

        } catch (e) {
          console.error(e);
          toast("Erro ao conectar com o servidor", "error");
        }
      }

      // ── Salvar reserva ─────────────────────────────────────────────────
      async function salvarSala(e) {
        e.preventDefault();
        const btn = document.getElementById("btnSubmit");

        const inicio  = document.getElementById("inicio_hr").value;
        const termino = document.getElementById("termino_hr").value;

        if (termino <= inicio) {
          toast("O término deve ser após o início", "error");
          return;
        }

        const dados = {
          sala:        document.getElementById("sala").value,
          data_uso:    document.getElementById("data_uso").value,
          inicio_hr:   inicio,
          termino_hr:  termino,
        };
        
        // Se for admin, envia o nome escolhido. Se for func, o backend já preenche sozinho.
        if(isUserAdmin){
            dados.funcionario = document.getElementById("funcionario").value;
            if(!dados.funcionario){
                toast("Selecione um responsável para a reserva.", "warn");
                return;
            }
        }

        btn.disabled     = true;
        btn.textContent  = "Verificando…";

        try {
          const res = await fetchComToken(`${BASE}/salas`, {
            method:  "POST",
            body:    JSON.stringify(dados),
          });

          const json = await res.json();

          if (!res.ok) {
            // 409 = conflito de horário
            toast(json.erro || "Erro ao cadastrar", res.status === 409 ? "warn" : "error");
            return;
          }

          toast("Reserva cadastrada com sucesso!");
          document.getElementById("formSalas").reset();
          carregarSalas();

        } catch (e) {
          console.error(e);
          toast("Erro ao conectar com o servidor", "error");
        } finally {
          btn.disabled    = false;
          btn.textContent = "✓  Confirmar Reserva";
        }
      }

      // ── Excluir reserva ────────────────────────────────────────────────
      async function excluirSala(id) {
        if (!confirm("Deseja remover esta reserva?")) return;
        try {
          const res = await fetchComToken(`${BASE}/salas/${id}`, { method: "DELETE" });
          const json = await res.json();
          
          if (!res.ok) {
              toast(json.erro || "Erro ao remover reserva.", "error");
              return;
          }
          
          toast("Reserva removida");
          carregarSalas();
        } catch (e) {
          console.error(e);
          toast("Erro ao remover reserva", "error");
        }
      }

      // ── Auto-refresh a cada 60 s ───────────────────────────────────────
      function reiniciarBarra() {
        const bar = document.getElementById("refreshBar");
        bar.style.animation = "none";
        bar.offsetHeight;   // reflow
        bar.style.animation = "";
      }

      setInterval(() => {
        carregarSalas();
        reiniciarBarra();
      }, 60_000);

      // ── Inicialização ──────────────────────────────────────────────────
      document.getElementById("data_uso").min =
        new Date().toISOString().split("T")[0];

      carregarOpcoesSalas();
      configurarFormularioFuncionario();
      carregarSalas();
    </script>
  </body>
</html>
