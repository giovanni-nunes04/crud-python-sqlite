<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Relatório de Acessos</title>

  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Syne:wght@400;700;800&display=swap" rel="stylesheet"/>

  <style>
    :root {
      --bg:#0b0c0f; --bg2:#111318; --border:#23262f;
      --blue:#4f8ef7; --text:#d4d8e2; --dim:#555b6e;
      --accent:#f0a500; --red:#ff4444; --green:#3ecf8e;
    }

    body { background: var(--bg2); color: var(--text); font-family: "Syne"; margin:0; padding:40px 20px;}
    .container { max-width:900px; margin:auto; }

    .report-header {
      background: var(--bg);
      border:1px solid var(--border);
      padding:28px;
      border-radius:8px;
      display:flex; justify-content:space-between; flex-wrap:wrap;
    }

    .btn {
      padding:12px 22px;
      border:none;
      border-radius:4px;
      cursor:pointer;
      font-weight:700;
      font-size:11px;
    }

    .btn-blue { background:var(--blue); color:#fff;}
    .btn-ghost { background:transparent; border:1px solid var(--border); color:var(--dim); }

    .table-wrap { margin-top:20px; background:var(--bg); border-radius:8px; overflow:hidden;}
    table { width:100%; border-collapse:collapse;}
    th, td { padding:12px; border-bottom:1px solid var(--border); }

    .toast {
      position:fixed; bottom:20px; right:20px;
      background:var(--bg);
      padding:10px;
      border-radius:5px;
      opacity:0;
      transition:0.3s;
    }
    .toast.show { opacity:1; }
  </style>
</head>

<body>

<div class="container">

  <div class="report-header">
    <h1>Relatório de Acessos</h1>
    <div>
      <button class="btn btn-blue" onclick="carregarLogs()">Gerar</button>
      <button class="btn btn-ghost" onclick="limparLogs()">Limpar</button>
      </div>
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>#</th>
          <th>Usuário</th>
          <th>Data</th>
          <th>Hora</th>
        </tr>
      </thead>
      <tbody id="corpoTabela"></tbody>
    </table>
  </div>

</div>

<div class="toast" id="toast"></div>

<script>
const API = "http://localhost:5000/api/registros/logs";

let todosLogs = [];

function getToken() {
  return localStorage.getItem("token");
}

function logout() {
  localStorage.removeItem("token");
  window.location.href = "/login";
}

function toast(msg, tipo="success") {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.className = "toast show";
  setTimeout(()=> el.className="toast",3000);
}

function fmtData(d) {
  if(!d) return "-";
  const [y,m,da] = d.split("-");
  return `${da}/${m}/${y}`;
}

function renderizar(logs){
  const tbody = document.getElementById("corpoTabela");

  if(logs.length === 0){
    tbody.innerHTML = "<tr><td colspan='4'>Nenhum registro</td></tr>";
    return;
  }

  tbody.innerHTML = logs.map((r,i)=>`
    <tr>
      <td>${i+1}</td>
      <td>${r.usuario}</td>
      <td>${fmtData(r.data_login)}</td>
      <td>${r.hora_login}</td>
    </tr>
  `).join("");
}

async function carregarLogs(){
  const token = getToken();

  if(!token){
    toast("Faça login novamente","error");
    return logout();
  }

  try{
    const res = await fetch(API,{
      headers:{
        "Authorization":`Bearer ${token}`
      }
    });

    if(res.status === 401){
      toast("Sessão expirada","error");
      return logout();
    }

    if(res.status === 403){
      toast("Apenas admin pode acessar","error");
      return;
    }

    if(!res.ok) throw new Error();

    todosLogs = await res.json();
    renderizar(todosLogs);

  }catch{
    toast("Erro ao buscar logs","error");
  }
}

async function limparLogs(){
  const token = getToken();

  try{
    const res = await fetch(API,{
      method:"DELETE",
      headers:{
        "Authorization":`Bearer ${token}`
      }
    });

    if(!res.ok) throw new Error();

    todosLogs=[];
    renderizar([]);
    toast("Logs apagados");

  }catch{
    toast("Erro ao limpar logs","error");
  }
}
</script>

</body>
</html>
