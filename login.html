<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sistema</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f4f4f9;
            margin: 0;
        }
        .login-container {
            background-color: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            width: 300px;
        }
        .login-container h2 {
            text-align: center;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
        }
        .form-group input {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #007BFF;
            color: #fff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background-color: #0056b3;
        }
        .erro-msg {
            color: red;
            text-align: center;
            margin-top: 10px;
            font-size: 14px;
        }
    </style>
</head>
<body>

<div class="login-container">
    <h2>Login</h2>
    <form id="loginForm">
        <div class="form-group">
            <label for="cpf">CPF:</label>
            <input type="text" id="cpf" placeholder="Apenas números" required>
        </div>
        <div class="form-group">
            <label for="senha">Senha:</label>
            <input type="password" id="senha" required>
        </div>
        <button type="submit">Entrar</button>
        <div id="mensagemErro" class="erro-msg"></div>
    </form>
</div>

<script>
    document.getElementById('loginForm').addEventListener('submit', async function(event) {
        // Evita que a página recarregue ao enviar o formulário
        event.preventDefault();
        
        const cpf = document.getElementById('cpf').value;
        const senha = document.getElementById('senha').value;
        const mensagemErro = document.getElementById('mensagemErro');
        
        mensagemErro.textContent = ""; // Limpa erros anteriores

        try {
            // Chama a nossa API de login
            const resposta = await fetch('/api/funcionarios/login', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ cpf: cpf, senha: senha })
            });

            const dados = await resposta.json();

            if (resposta.ok) {
                // Sucesso! Guarda o token e se é admin no navegador
                localStorage.setItem('token', dados.token);
                localStorage.setItem('is_admin', dados.is_admin);
                
                // Redireciona o usuário para a página inicial
                window.location.href = "/";
            } else {
                // Mostra o erro retornado pela API (ex: "Credenciais inválidas")
                mensagemErro.textContent = dados.erro || "Erro ao fazer login.";
            }
        } catch (erro) {
            console.error("Erro na requisição:", erro);
            mensagemErro.textContent = "Erro de conexão com o servidor.";
        }
    });
</script>

</body>
</html>
