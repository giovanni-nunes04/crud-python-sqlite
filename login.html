<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — Sistema</title>
  <link
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Syne:wght@400;700;800&display=swap"
    rel="stylesheet"
  />
  <style>
    :root {
      --bg:     #0b0c0f;
      --bg2:    #111318;
      --border: #23262f;
      --blue:   #4f8ef7;
      --text:   #d4d8e2;
      --dim:    #555b6e;
      --accent: #f0a500;
      --red:    #ff4444;
      --green:  #3ecf8e;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: "Syne", sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ── Grid de fundo decorativo ── */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(var(--border) 1px, transparent 1px),
        linear-gradient(90deg, var(--border) 1px, transparent 1px);
      background-size: 40px 40px;
      opacity: 0.4;
      pointer-events: none;
    }

    .login-wrapper {
      position: relative;
      width: 100%;
      max-width: 420px;
      padding: 20px;
    }

    /* ── Logo / Header ── */
    .login-header {
      text-align: center;
      margin-bottom: 32px;
    }

    .login-header .tag {
      font-family: "IBM Plex Mono", monospace;
      font-size: 11px;
      color: var(--blue);
      letter-spacing: 0.15em;
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    .login-header h1 {
      font-size: 28px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .login-header h1 span { color: var(--blue); }

    /* ── Card ── */
    .login-card {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 32px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--dim);
      margin-bottom: 8px;
    }

    .input-wrap {
      position: relative;
    }

    .input-wrap .input-icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--dim);
      font-size: 14px;
      pointer-events: none;
    }

    input {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      color: white;
      padding: 12px 12px 12px 38px;
      border-radius: 4px;
      font-family: "IBM Plex Mono", monospace;
      font-size: 13px;
      transition: border-color 0.2s;
    }

    input:focus {
      outline: none;
      border-color: var(--blue);
    }

    input::placeholder { color: var(--dim); }

    /* Toggle senha visível */
    .toggle-senha {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--dim);
      cursor: pointer;
      font-size: 14px;
      padding: 0;
      transition: color 0.2s;
    }
    .toggle-senha:hover { color: var(--text); }

    /* ── Mensagem de erro ── */
    .error-msg {
      background: rgba(255,68,68,0.08);
      border: 1px solid rgba(255,68,68,0.3);
      border-radius: 4px;
      color: var(--red);
      font-family: "IBM Plex Mono", monospace;
      font-size: 12px;
      padding: 10px 14px;
      margin-bottom: 20px;
      display: none;
    }
    .error-msg.show { display: block; }

    /* ── Botão ── */
    .btn-login {
      width: 100%;
      background: var(--blue);
      color: white;
      border: none;
      padding: 14px;
      border-radius: 4px;
      cursor: pointer;
      font-family: "Syne", sans-serif;
      font-weight: 700;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      transition: opacity 0.2s, transform 0.1s;
      margin-top: 4px;
    }

    .btn-login:hover   { opacity: 0.85; }
    .btn-login:active  { transform: scale(0.98); }
    .btn-login:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    /* Loading spinner no botão */
    .btn-login.loading::after {
      content: "";
      display: inline-block;
      width: 12px;
      height: 12px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin-left: 10px;
      vertical-align: middle;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Rodapé ── */
    .login-footer {
      text-align: center;
      margin-top: 24px;
      font-size: 11px;
      color: var(--dim);
      font-family: "IBM Plex Mono", monospace;
    }

    /* ── Sucesso ── */
    .success-overlay {
      position: fixed;
      inset: 0;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s;
      z-index: 100;
    }

    .success-overlay.show { opacity: 1; pointer-events: all; }

    .success-overlay .icon {
      font-size: 48px;
      animation: pop 0.5s ease;
    }

    .success-overlay p {
      font-family: "IBM Plex Mono", monospace;
      color: var(--green);
      font-size: 14px;
    }

    @keyframes pop {
      0%   { transform: scale(0.5); opacity: 0; }
      70%  { transform: scale(1.2); }
      100% { transform: scale(1);   opacity: 1; }
    }
  </style>
</head>
<body>

  <!-- Overlay de sucesso -->
  <div class="success-overlay" id="successOverlay">
    <div class="icon">✅</div>
    <p>Acesso autorizado. Redirecionando…</p>
  </div>

  <div class="login-wrapper">
    <div class="login-header">
      <div class="tag">// autenticação</div>
      <h1>Sistema <span>Interno</span></h1>
    </div>

    <div class="login-card">

      <div class="error-msg" id="errorMsg"></div>

      <div class="form-group">
        <label>Usuário</label>
        <div class="input-wrap">
          <span class="input-icon">👤</span>
          <input
            type="text"
            id="usuario"
            placeholder="seu.usuario"
            autocomplete="username"
            autofocus
          />
        </div>
      </div>

      <div class="form-group">
        <label>Senha</label>
        <div class="input-wrap">
          <span class="input-icon">🔑</span>
          <input
            type="password"
            id="senha"
            placeholder="••••••••"
            autocomplete="current-password"
          />
          <button
            class="toggle-senha"
            type="button"
            onclick="toggleSenha()"
            title="Mostrar/ocultar senha"
            id="toggleBtn"
          >👁</button>
        </div>
      </div>

      <button class="btn-login" id="btnLogin" onclick="fazerLogin()">
        Entrar
      </button>
    </div>

    <div class="login-footer">
      acesso restrito a usuários autorizados
    </div>
  </div>

  <script>
    const API = "http://localhost:5000/api/registros/login";

    // ── Toggle senha ─────────────────────────────────────────────────────────
    function toggleSenha() {
      const input = document.getElementById("senha");
      const btn   = document.getElementById("toggleBtn");
      const show  = input.type === "password";
      input.type  = show ? "text" : "password";
      btn.textContent = show ? "🙈" : "👁";
    }

    // ── Mostrar erro ─────────────────────────────────────────────────────────
    function mostrarErro(msg) {
      const el = document.getElementById("errorMsg");
      el.textContent = msg;
      el.classList.add("show");
      // Chacoalha o card
      el.animate([
        { transform: "translateX(-6px)" },
        { transform: "translateX(6px)"  },
        { transform: "translateX(-4px)" },
        { transform: "translateX(0)"    }
      ], { duration: 300 });
    }

    function limparErro() {
      document.getElementById("errorMsg").classList.remove("show");
    }

    // ── Login ─────────────────────────────────────────────────────────────────
    async function fazerLogin() {
      limparErro();

      const usuario = document.getElementById("usuario").value.trim();
      const senha   = document.getElementById("senha").value;
      const btn     = document.getElementById("btnLogin");

      if (!usuario || !senha) {
        mostrarErro("Preencha usuário e senha");
        return;
      }

      btn.disabled    = true;
      btn.textContent = "Verificando";
      btn.classList.add("loading");

      try {
        const res  = await fetch(API, {
          method:  "POST",
          headers: { "Content-Type": "application/json" },
          body:    JSON.stringify({ usuario, senha }),
        });

        const json = await res.json();

        if (!res.ok) {
          mostrarErro(json.erro || "Credenciais inválidas");
          return;
        }

        // Salva sessão simples no sessionStorage
        sessionStorage.setItem("usuario_logado", json.usuario);

        // Mostra overlay de sucesso e redireciona
        document.getElementById("successOverlay").classList.add("show");
        setTimeout(() => {
          window.location.href = "/";   // ← altere para sua rota principal
        }, 1800);

      } catch {
        mostrarErro("Erro ao conectar com o servidor");
      } finally {
        btn.disabled    = false;
        btn.textContent = "Entrar";
        btn.classList.remove("loading");
      }
    }

    // ── Enter para enviar ────────────────────────────────────────────────────
    document.addEventListener("keydown", e => {
      if (e.key === "Enter") fazerLogin();
    });
  </script>
</body>
</html>
